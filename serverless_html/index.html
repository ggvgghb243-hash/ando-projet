    // Safety fallback for auth loader

    // Track User Profile & Activity in Firebase users_meta
    function trackUserActivity(user, actionName) {
        if (!user) return;
        const email = user.email || '';
        const uid = email ? email.replace(/[@.]/g, '_') : user.uid;
        const isHardcodedAdmin = ADMIN_EMAILS.includes(email.toLowerCase());

        fbDb.ref('users_meta/' + uid).once('value', snap => {
            const umeta = snap.val() || {};
            const loginCount = (umeta.login_count || 0) + (actionName.includes('Login') || actionName.includes('Accessed') ? 1 : 0);
            const role = isHardcodedAdmin ? 'ADMIN' : (umeta.role || 'USER');

            const updatedData = {
                uid: uid,
                email: email,
                displayName: user.displayName || (email ? email.split('@')[0] : 'User'),
                photoURL: user.photoURL || '',
                role: role,
                last_login: Date.now(),
                last_login_formatted: new Date().toLocaleString(),
                login_count: loginCount,
                user_agent: navigator.userAgent
            };

            // Set created_at if first time
            if (!umeta.created_at) updatedData.created_at = Date.now();

            fbDb.ref('users_meta/' + uid).update(updatedData);

            // Append to user's activity history
            fbDb.ref(`users_meta/${uid}/activity_history`).push({
                time: Date.now(),
                action: actionName
            });

            // Push to platform-wide audit logs
            fbDb.ref('audit_logs').push({
                timestamp: Date.now(),
                user: email || uid,
                action: actionName
            });
        });
    }

    function initUserSession() {
        // Check for last APK build in Firebase
        fbDb.ref('panel_users/' + userId).once('value', snap => {
            const u = snap.val() || {};
            const lastApk = u.last_apk || '';
            const lastArtifact = u.last_artifact_name || '';
            if (lastApk) {
                const dlBtn = document.getElementById('downloadBtn');
                dlBtn.setAttribute('data-apk', lastApk);
                if (lastArtifact) {
                    dlBtn.setAttribute('data-artifact', lastArtifact);
                }
                document.getElementById('downloadArea').style.display = 'block';
            }
        });

        // Setup real-time health and device listeners
        setupRealtimeHealthListeners();
    }

    // Ultra-Fast Direct APK download (Release Asset -> Artifact Zip Fallback)
    async function downloadApk(el) {
        const apkName = el.getAttribute('data-apk') || 'app.apk';
        const targetArtifact = el.getAttribute('data-artifact') || '';
        if (!githubToken) { alert('Token not loaded yet, wait a moment'); return; }
        el.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i>DOWNLOADING...';
        el.style.pointerEvents = 'none';
        
        try {
            // STAGE 1: Try Instant Direct Release Download (No unzipping, 1-2 sec max)
            let downloaded = false;
            try {
                const relRes = await fetch('https://api.github.com/repos/ggvgghb243-hash/ando-projet/releases/tags/v1.0', {
                    headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (relRes.ok) {
                    const relData = await relRes.json();
                    const asset = (relData.assets || []).find(a => a.name === apkName || (userId && a.name.includes(userId)));
                    if (asset && asset.url) {
                        const apkRes = await fetch(asset.url, {
                            headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/octet-stream' }
                        });
                        if (apkRes.ok) {
                            const blob = await apkRes.blob();
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url; a.download = apkName; document.body.appendChild(a);
                            a.click(); a.remove();
                            setTimeout(() => URL.revokeObjectURL(url), 5000);
                            downloaded = true;
                        }
                    }
                }
            } catch(relErr) {
                console.warn('Release direct download skipped, falling back to artifact zip:', relErr);
            }

            // STAGE 2: Artifact Zip Fallback if Release asset wasn't ready
            if (!downloaded) {
                const res = await fetch('https://api.github.com/repos/ggvgghb243-hash/ando-projet/actions/artifacts?per_page=15', {
                    headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
                });
                const data = await res.json();
                const artifact = (data.artifacts || []).find(a => {
                    if (a.expired) return false;
                    if (targetArtifact) return a.name === targetArtifact;
                    return a.name.includes(userId);
                });
                if (!artifact) throw new Error('No APK build found for your account. Please build your APK first.');

                const zipRes = await fetch(artifact.archive_download_url, {
                    headers: { 'Authorization': 'token ' + githubToken }
                });
                if (!zipRes.ok) throw new Error('Failed to download artifact: ' + zipRes.status);
                const zipBlob = await zipRes.blob();

                const zip = await JSZip.loadAsync(zipBlob);
                const apkFile = Object.keys(zip.files).find(f => f.endsWith('.apk'));
                if (!apkFile) throw new Error('No APK found inside artifact zip');

                const apkBlob = await zip.files[apkFile].async('blob');
                const url = URL.createObjectURL(apkBlob);
                const a = document.createElement('a');
                a.href = url; a.download = apkName; document.body.appendChild(a);
                a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            }

            el.innerHTML = '<i class="fas fa-check-circle" style="margin-right:6px;"></i>DOWNLOADED!';
            setTimeout(() => {
                el.innerHTML = '<i class="fas fa-download" style="margin-right:6px;"></i>DOWNLOAD APK';
                el.style.pointerEvents = 'auto';
            }, 2000);
        } catch(err) {
            console.error('Download error:', err);
            alert('Download failed: ' + err.message);
            el.innerHTML = '<i class="fas fa-download" style="margin-right:6px;"></i>DOWNLOAD APK';
            el.style.pointerEvents = 'auto';
        }
    }

    document.getElementById('buildForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('buildBtn');
        const text = document.getElementById('buildText');
        const icon = document.getElementById('buildIcon');

        // Check build permission
        const perms = window.userPermissions || {};
        if (!window.isUserAdmin && perms.build_apk === false) {
            alert('Access Denied: APK Building feature is disabled for your account. Contact Admin on Telegram (@abid64x) for access.');
            return;
        }
        
        btn.disabled = true;
        text.textContent = 'STARTING...';
        icon.className = 'fas fa-spinner fa-spin';

        const formData = new FormData(this);
        const appName = formData.get('app_name');
        const packageName = formData.get('package_name');
        const webviewUrl = formData.get('webview_url') || '';
        const buildType = formData.get('build_type');
        const iconFile = document.getElementById('appIconInput').files[0];

        // Track build activity & increment count
        if (fbAuth.currentUser) {
            fbDb.ref('users_meta/' + userId).once('value', snap => {
                const udata = snap.val() || {};
                const count = (udata.build_count || 0) + 1;
                fbDb.ref('users_meta/' + userId + '/build_count').set(count);
            });
            trackUserActivity(fbAuth.currentUser, `Triggered APK Build: ${appName} (${packageName})`);
        }

        let iconBase64 = '';
        if (iconFile) {
            try {
                iconBase64 = await new Promise((resolve, reject) => {
                    const img = new Image();
                    const url = URL.createObjectURL(iconFile);
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 96;
                        canvas.height = 96;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, 96, 96);
                        ctx.drawImage(img, 0, 0, 96, 96);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        URL.revokeObjectURL(url);
                        const b64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
                        resolve(b64);
                    };
                    img.onerror = (err) => {
                        URL.revokeObjectURL(url);
                        reject(err);
                    };
                    img.src = url;
                });
            } catch(err) {
                console.error('Error processing icon file:', err);
            }
        }

        // Reset progress UI & Firebase status
        document.getElementById('logLines').innerHTML = '';
        document.getElementById('progressBar').style.width = '5%';
        document.getElementById('buildStatus').textContent = 'Wait for building...';
        document.getElementById('progressArea').style.display = 'block';

        fbDb.ref('panel_users/' + userId + '/build_status').set({
            status: '⏳ Starting build...',
            percent: 10,
            last_log: 'Wait for building...'
        });

        // Trigger GitHub Actions workflow dispatch
        fetch('https://api.github.com/repos/ggvgghb243-hash/ando-projet/actions/workflows/build.yml/dispatches', {
            method: 'POST',
            headers: {
                'Authorization': 'token ' + githubToken,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                ref: 'main',
                inputs: {
                    app_name: appName,
                    package_name: packageName,
                    webview_url: webviewUrl,
                    user_id: userId,
                    build_type: buildType,
                    app_icon_b64: iconBase64
                }
            })
        }).then(res => {
            if (res.ok || res.status === 204) {
                console.log('GitHub Actions workflow triggered successfully');
                listenToBuildStatus();
            } else {
                return res.json().then(errData => {
                    throw new Error(errData.message || 'Failed to trigger workflow');
                });
            }
        }).catch(err => {
            console.error('Workflow trigger error:', err);
            document.getElementById('buildStatus').textContent = '❌ Error: ' + err.message;
            btn.disabled = false;
            text.textContent = 'RETRY BUILD';
            icon.className = 'fas fa-rocket';
        });
    });

    function listenToBuildStatus() {
        const buildRef = fbDb.ref('panel_users/' + userId + '/build_status');
        buildRef.on('value', snap => {
            const val = snap.val();
            if (!val) return;

            const progressBar = document.getElementById('progressBar');
            const buildStatus = document.getElementById('buildStatus');
            const logLines = document.getElementById('logLines');
            const consoleLog = document.getElementById('consoleLog');
            const btn = document.getElementById('buildBtn');
            const text = document.getElementById('buildText');
            const icon = document.getElementById('buildIcon');

            if (val.percent !== undefined) {
                progressBar.style.width = val.percent + '%';
            }

            if (val.last_log) {
                buildStatus.textContent = val.status || val.last_log;
                const line = document.createElement('div');
                line.className = 'console-line';
                line.textContent = `[${new Date().toLocaleTimeString()}] ${val.last_log}`;
                logLines.appendChild(line);
                consoleLog.scrollTop = consoleLog.scrollHeight;
            }

            if (val.status && (val.status.includes('Complete') || val.percent >= 100)) {
                btn.disabled = false;
                text.textContent = 'SUCCESS!';
                icon.className = 'fas fa-check-circle';

                // Fetch latest APK name & artifact name
                fbDb.ref('panel_users/' + userId).once('value', uSnap => {
                    const u = uSnap.val() || {};
                    const lastApk = u.last_apk || 'app.apk';
                    const lastArtifact = u.last_artifact_name || '';
                    const dlBtn = document.getElementById('downloadBtn');
                    dlBtn.setAttribute('data-apk', lastApk);
                    if (lastArtifact) {
                        dlBtn.setAttribute('data-artifact', lastArtifact);
                    }
                    document.getElementById('downloadArea').style.display = 'block';
                });

                buildRef.off();
            } else if (val.status && val.status.includes('Failed')) {
                btn.disabled = false;
                text.textContent = 'BUILD FAILED';
                icon.className = 'fas fa-times-circle';
                document.getElementById('progressArea').style.display = 'block';
                buildRef.off();
            }
        });
    }

    function checkIsAdmin() {
        if (window.isUserAdmin === true) return true;
        if (currentUserProfile && currentUserProfile.role === 'ADMIN') return true;
        if (fbAuth.currentUser) {
            const email = (fbAuth.currentUser.email || '').toLowerCase();
            if (ADMIN_EMAILS.includes(email)) return true;
        }
        return false;
    }

    function renderDeviceList() {
        const tbody = document.getElementById('deviceList');
        if (!tbody) return;

        const isAdmin = checkIsAdmin();
        const thRow = document.querySelector('.data-table thead tr');
        if (thRow) {
            if (isAdmin) {
                thRow.innerHTML = '<th>Device</th><th>Owner</th><th>Battery</th><th>Status</th><th style="text-align:right;">Action</th>';
            } else {
                thRow.innerHTML = '<th>Device</th><th>Battery</th><th>Status</th><th style="text-align:right;">Action</th>';
            }
        }

        const devKeys = Object.keys(deviceCache);
        let totalCount = devKeys.length;
        let onlineCount = 0;

        // Sort: online first, then by lastSeen desc
        const sortedKeys = devKeys.sort((a, b) => {
            const da = deviceCache[a], db = deviceCache[b];
            if (da.online !== db.online) return db.online ? 1 : -1;
            return (db.lastSeen || 0) - (da.lastSeen || 0);
        });

        let html = '';
        sortedKeys.forEach(did => {
            const d = deviceCache[did];
            if (d.online) onlineCount++;

            const model = d.model || 'Android Device';
            const batt = d.battery !== undefined ? d.battery : '--';
            const battNum = parseInt(batt) || 0;
            const battIcon = battNum > 75 ? 'fa-battery-full' : battNum > 40 ? 'fa-battery-half' : battNum > 15 ? 'fa-battery-quarter' : 'fa-battery-empty';
            const battColor = battNum <= 15 ? 'var(--danger)' : battNum <= 40 ? 'var(--warning)' : 'var(--success)';
            
            const isOnline = d.online;
            const statusClass = isOnline ? 'status-online' : 'status-offline';
            const statusText = isOnline ? 'Online' : 'Offline';
            const rowClass = isOnline ? 'device-row-online' : 'device-row-offline';
            const ownerUid = d.ownerUid || userId;

            html += `
            <tr class="${rowClass}">
                <td>
                    <div style="font-weight: 700; color: #fff; font-size: 0.88rem; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-mobile-alt" style="color: ${isOnline ? 'var(--primary)' : 'var(--text-muted)'}; font-size: 0.95rem;"></i>
                        ${model}
                    </div>
                    <code style="font-size: 0.7rem; color: var(--text-muted);">${d.did}</code>
                </td>
                ${isAdmin ? `
                <td>
                    <span class="glass-badge" style="font-size: 0.65rem;">
                        <i class="fas fa-user" style="color: var(--primary);"></i> ${ownerUid}
                    </span>
                </td>
                ` : ''}
                <td>
                    <span style="font-size: 0.82rem; font-weight: 600; color: ${battColor}; display: inline-flex; align-items: center; gap: 5px;">
                        <i class="fas ${battIcon}"></i> ${batt}%
                    </span>
                </td>
                <td>
                    <span class="${statusClass}">
                        ${statusText}
                    </span>
                </td>
                <td style="text-align: right;">
                    <div style="display: flex; gap: 6px; justify-content: flex-end;">
                        <a href="control.html?uid=${ownerUid}&did=${d.did}" class="btn-accent" style="padding: 6px 14px; font-size: 0.78rem; border-radius: var(--radius-pill);">
                            Control <i class="fas fa-chevron-right" style="margin-left: 4px; font-size: 0.7rem;"></i>
                        </a>
                        ${isAdmin ? `
                        <button onclick="deleteDevice('${ownerUid}', '${d.did}', '${model}')" class="btn-danger-ghost" style="padding: 6px 10px; border-radius: var(--radius-pill);" title="Delete Device">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                        ` : ''}
                    </div>
                </td>
            </tr>
            `;
        });

        // Update badge counters
        const countBadge = document.getElementById('deviceCount');
        const onlineBadge = document.getElementById('onlineCount');
        if (countBadge) countBadge.textContent = totalCount;
        if (onlineBadge) {
            onlineBadge.textContent = `${onlineCount} online`;
            onlineBadge.style.color = onlineCount > 0 ? 'var(--success)' : 'var(--danger)';
            onlineBadge.style.background = onlineCount > 0 ? 'var(--success-bg)' : 'var(--danger-bg)';
            onlineBadge.style.borderColor = onlineCount > 0 ? 'var(--success-border)' : 'var(--danger-border)';
        }

        if (totalCount === 0) {
            tbody.innerHTML = `
            <tr>
                <td colspan="${isAdmin ? '5' : '4'}" style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
                    <i class="fas fa-mobile-alt" style="font-size: 2rem; color: var(--primary); opacity: 0.4; margin-bottom: 10px; display: block;"></i>
                    <p style="font-size: 0.88rem; margin-bottom: 4px;">No devices connected yet</p>
                    <p style="font-size: 0.76rem; color: var(--text-dim);">Build and install the APK on your Android device to see it appear here.</p>
                </td>
            </tr>`;
        } else {
            tbody.innerHTML = html;
        }

        // Hide skeleton and reveal list
        const skeleton = document.getElementById('deviceSkeleton');
        const listArea = document.getElementById('deviceListArea');
        if (skeleton) skeleton.style.display = 'none';
        if (listArea) listArea.style.display = 'block';
    }

    function deleteDevice(ownerUid, did, model) {
        if (!confirm(`Are you sure you want to permanently delete device "${model}" (${did}) from account "${ownerUid}"?`)) {
            return;
        }
        fbDb.ref(`users/${ownerUid}/devices/${did}`).remove().then(() => {
            delete deviceCache[did];
            renderDeviceList();
        }).catch(err => {
            alert('Delete failed: ' + err.message);
        });
    }

    function setupRealtimeHealthListeners() {
        // Clear previous listeners & cache
        Object.keys(healthListeners).forEach(k => {
            if (typeof healthListeners[k] === 'function') healthListeners[k]();
        });
        healthListeners = {};
        deviceCache = {};

        const isAdmin = checkIsAdmin();

        if (isAdmin) {
            // ADMIN: Listen across all users in root /users
            const usersRootRef = fbDb.ref('users');
            const onChildAdded = usersRootRef.on('child_added', userSnap => {
                const targetUid = userSnap.key;
                listenToUserDevices(targetUid);
            });
            const onChildRemoved = usersRootRef.on('child_removed', userSnap => {
                const targetUid = userSnap.key;
                Object.keys(deviceCache).forEach(did => {
                    if (deviceCache[did].ownerUid === targetUid) {
                        delete deviceCache[did];
                    }
                });
                renderDeviceList();
            });
            healthListeners['root_users_added'] = () => usersRootRef.off('child_added', onChildAdded);
            healthListeners['root_users_removed'] = () => usersRootRef.off('child_removed', onChildRemoved);
        } else {
            // STANDARD USER: Listen exclusively to their own devices
            listenToUserDevices(userId);
        }
    }

    function listenToUserDevices(targetUid) {
        const devRef = fbDb.ref('users/' + targetUid + '/devices');
        
        const onDevAdded = devRef.on('child_added', devSnap => {
            const did = devSnap.key;
            if (!deviceCache[did]) {
                deviceCache[did] = { did: did, ownerUid: targetUid, online: false, battery: '--', model: 'Android Device' };
            }

            // Real-time Health Listener
            const healthRef = fbDb.ref(`users/${targetUid}/devices/${did}/health`);
            const onHealth = healthRef.on('value', hSnap => {
                const h = hSnap.val() || {};
                let isOnline = h.online === true || h.online === 'true' || h.online === 1;
                // Staleness check: if lastSeen is older than 90s, consider offline
                if (isOnline && h.lastSeen) {
                    const age = Date.now() - h.lastSeen;
                    if (age > 90000) isOnline = false;
                }
                if (deviceCache[did]) {
                    deviceCache[did].online = isOnline;
                    deviceCache[did].battery = h.battery !== undefined ? h.battery : deviceCache[did].battery;
                    deviceCache[did].lastSeen = h.lastSeen || 0;
                    renderDeviceList();
                }
            });
            healthListeners[`${did}_health`] = () => healthRef.off('value', onHealth);

            // Real-time Info Listener
            const infoRef = fbDb.ref(`users/${targetUid}/devices/${did}/info`);
            const onInfo = infoRef.on('value', iSnap => {
                const info = iSnap.val() || {};
                if (deviceCache[did]) {
                    deviceCache[did].model = info.model || info.device_name || deviceCache[did].model;
                    renderDeviceList();
                }
            });
            healthListeners[`${did}_info`] = () => infoRef.off('value', onInfo);
        });

        const onDevRemoved = devRef.on('child_removed', devSnap => {
            const did = devSnap.key;
            delete deviceCache[did];
            renderDeviceList();
        });

        healthListeners[`${targetUid}_dev_added`] = () => devRef.off('child_added', onDevAdded);
        healthListeners[`${targetUid}_dev_removed`] = () => devRef.off('child_removed', onDevRemoved);

        // Initial render after brief query
        devRef.once('value', () => {
            renderDeviceList();
        });
    }

    function refreshDevices() {
        const skeleton = document.getElementById('deviceSkeleton');
        const listArea = document.getElementById('deviceListArea');
        if (skeleton) skeleton.style.display = 'block';
        if (listArea) listArea.style.display = 'none';
        setupRealtimeHealthListeners();
    }
    </script>
</body>
